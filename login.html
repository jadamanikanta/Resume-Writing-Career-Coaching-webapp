<head>

<body>

<main class="auth-page">

    <div class="background-decoration">
    <span class="career-path path-one"></span>
    <span class="career-path path-two"></span>

    <span class="resume-card resume-one">
        <span class="resume-line line-long"></span>
        <span class="resume-line line-medium"></span>
        <span class="resume-line line-short"></span>
    </span>

    <span class="resume-card resume-two">
        <span class="resume-line line-long"></span>
        <span class="resume-line line-medium"></span>
        <span class="resume-line line-short"></span>
    </span>

    <span class="career-node node-one"></span>
    <span class="career-node node-two"></span>
    <span class="career-node node-three"></span>

    <span class="progress-track">
        <span class="progress-fill"></span>
    </span>

    <span class="floating-check check-one">
        <i data-lucide="check"></i>
    </span>

    <span class="floating-check check-two">
        <i data-lucide="check"></i>
    </span>
</div>

    <div class="auth-controls">
        <button type="button" class="auth-control" id="themeToggle" aria-label="Toggle theme">
            <i data-lucide="moon"></i>
        </button>

        <button type="button" class="auth-control rtl-control" id="rtlToggle">
            <i data-lucide="arrow-left-right"></i>
        </button>
    </div>

    <section class="login-card">

        <div class="card-glow"></div>

        <div class="login-logo">
            <a href="index.html" class="careerlyn-logo" aria-label="CAREERLYN Home">

    <div class="logo-badge">
        <img
            src="logo.png"
            alt="CAREERLYN Emblem"
            class="brand-logo-img"
        >
    </div>

    <div class="logo-text-group">
        <span class="logo-brand-title">
            CAREER<span class="brand-lyn">LYN</span>
        </span>

        <span class="logo-brand-subtitle">
            RESUME &amp; CAREER COACHING
        </span>
    </div>

</a>
        </div>

        <div class="login-heading">
            <span class="login-eyebrow">CLIENT PORTAL</span>
            <h1>Welcome Back</h1>
            <p>
                Sign in to track your career progress, manage your projects and connect with your coach.
            </p>
        </div>

        <form class="login-form" id="loginForm">

            <div class="form-group">
                <label for="email">Email Address</label>

                <div class="input-wrapper">
                    <i data-lucide="mail"></i>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="input-wrapper">
                    <i data-lucide="lock-keyhole"></i>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                        aria-label="Show password"
                    >
                        <i data-lucide="eye"></i>
                    </button>
                </div>
            </div>

            <div class="login-options">

                <label class="remember-option">
                    <input type="checkbox" id="rememberMe">
                    <span class="custom-checkbox"></span>
                    <span>Remember Me</span>
                </label>

                <a href="#" class="forgot-link">Forgot Password?</a>

            </div>

            <button type="submit" class="login-btn">
                <span>Sign In</span>
                <i data-lucide="arrow-right"></i>
            </button>

        </form>

        <div class="divider">
            <span>OR CONTINUE WITH</span>
        </div>

        <div class="social-login">

            <button type="button" class="social-btn">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4" d="M21.35 12.27c0-.71-.06-1.39-.18-2.05H12v3.88h5.24a4.48 4.48 0 0 1-1.95 2.94v2.45h3.15c1.84-1.7 2.91-4.2 2.91-7.22Z"/>
                    <path fill="#34A853" d="M12 21.7c2.63 0 4.84-.87 6.45-2.35l-3.15-2.45c-.87.58-1.98.93-3.3.93-2.54 0-4.7-1.72-5.47-4.03H3.27v2.53A9.74 9.74 0 0 0 12 21.7Z"/>
                    <path fill="#FBBC05" d="M6.53 13.8A5.86 5.86 0 0 1 6.22 12c0-.62.11-1.22.31-1.8V7.67H3.27A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.06 1.02 4.33l3.26-2.53Z"/>
                    <path fill="#EA4335" d="M12 6.17c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.83 3.27 14.63 2.3 12 2.3a9.75 9.75 0 0 0-8.73 5.37l3.26 2.53c.77-2.31 2.93-4.03 5.47-4.03Z"/>
                </svg>
                <span>Google</span>
            </button>

            <button type="button" class="social-btn">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.08ZM12.03 7.25C11.88 5.02 13.69 3.18 15.77 3c.29 2.58-2.34 4.5-3.74 4.25Z"/>
                </svg>
                <span>Apple</span>
            </button>

            <button type="button" class="social-btn">
                <svg viewBox="0 0 24 24" aria-hidden="true">
    <path fill="#0A66C2" d="M5.2 3.8A2.2 2.2 0 1 1 5.2 8.2a2.2 2.2 0 0 1 0-4.4ZM3.3 9.7h3.8V21H3.3V9.7ZM9.5 9.7h3.6v1.55h.05c.5-.95 1.72-1.95 3.54-1.95 3.79 0 4.49 2.49 4.49 5.72V21h-3.8v-5.3c0-1.26-.02-2.88-1.76-2.88-1.76 0-2.03 1.38-2.03 2.79V21H9.5V9.7Z"/>
</svg>
                <span>LinkedIn</span>
            </button>

        </div>

        <p class="signup-text">
            Don't have an account?
            <a href="signup.html">Create an account</a>
        </p>

    </section>

</main>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const body = document.body;
    const html = document.documentElement;

    const themeToggle = document.getElementById("themeToggle");
    const rtlToggle = document.getElementById("rtlToggle");
    const passwordToggle = document.getElementById("passwordToggle");
    const passwordInput = document.getElementById("password");
    const loginForm = document.getElementById("loginForm");
    const rememberMe = document.getElementById("rememberMe");

    const savedTheme = localStorage.getItem("careerLift-theme");

    if (savedTheme === "dark") {
        body.classList.add("dark-mode");
    }

    const savedDirection =
        localStorage.getItem("careerLift-direction") || "ltr";

    html.setAttribute("dir", savedDirection);

    function refreshIcons() {
        if (window.lucide) {
            lucide.createIcons();
        }
    }

    function updateThemeIcon() {

        if (!themeToggle) return;

        const icon = body.classList.contains("dark-mode")
            ? "sun"
            : "moon";

        themeToggle.innerHTML =
            `<i data-lucide="${icon}"></i>`;

        refreshIcons();
    }

    function updateDirection() {

        const direction =
            html.getAttribute("dir") || "ltr";

        if (rtlToggle) {
    rtlToggle.innerHTML =
        '<i data-lucide="arrow-left-right"></i>';

    refreshIcons();
}
    }

    function loadRememberMe() {

        if (!rememberMe) return;

        rememberMe.checked =
            localStorage.getItem("rememberMe") === "true";
    }

    themeToggle?.addEventListener("click", () => {

        body.classList.toggle("dark-mode");

        const isDark =
            body.classList.contains("dark-mode");

        localStorage.setItem(
            "careerLift-theme",
            isDark ? "dark" : "light"
        );

        updateThemeIcon();
    });

    rtlToggle?.addEventListener("click", () => {

        const currentDirection =
            html.getAttribute("dir") || "ltr";

        const newDirection =
            currentDirection === "ltr"
                ? "rtl"
                : "ltr";

        html.setAttribute("dir", newDirection);

        localStorage.setItem(
            "careerLift-direction",
            newDirection
        );

        updateDirection();
    });

    passwordToggle?.addEventListener("click", () => {

        if (!passwordInput) return;

        const showPassword =
            passwordInput.type === "password";

        passwordInput.type =
            showPassword ? "text" : "password";

        passwordToggle.innerHTML =
            `<i data-lucide="${showPassword ? "eye-off" : "eye"}"></i>`;

        passwordToggle.setAttribute(
            "aria-label",
            showPassword
                ? "Hide password"
                : "Show password"
        );

        refreshIcons();
    });

    rememberMe?.addEventListener("change", () => {

        localStorage.setItem(
            "rememberMe",
            rememberMe.checked ? "true" : "false"
        );
    });

    loginForm?.addEventListener("submit", event => {

        event.preventDefault();

        const email =
            document.getElementById("email")?.value.trim();

        const password =
            document.getElementById("password")?.value.trim();

        if (!email || !password) return;

        window.location.href = "dashboard.html";
    });

    loadRememberMe();
    updateDirection();
    refreshIcons();
    updateThemeIcon();

});
</script>

</body>
</html>
